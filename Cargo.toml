[package]
name = "pipie"
version = "1.0.8"
edition = "2021"
description = "A radial (pie-menu) app launcher for Windows with live window previews"
authors = ["PiPie"]
license = "MIT"
repository = "https://github.com/lifeFxxker/pipie"
homepage = "https://github.com/lifeFxxker/pipie"
readme = "README.md"
keywords = ["launcher", "radial", "windows", "productivity", "pie-menu"]
categories = ["gui", "command-line-utilities"]

[[bin]]
name = "PiPie"
path = "src/main.rs"

[dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "implement",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Shutdown",
    "Win32_System_Power",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_UI_Accessibility",
    "Win32_Networking_WinInet",
] }

[profile.release]
opt-level = 3
# ⚠️ 不能用 `lto = true`（fat LTO）：rustc 1.96.0 全量 clean 构建会 miscompile
# 这份 unsafe FFI 代码，启动即崩 0xC0000409（warm 缓存构建侥幸不触发）。
# `thin` 仍做跨 crate 内联但不整链重优化，体积小且稳定。
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
